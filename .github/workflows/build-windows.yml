name: Build Windows Package

on:
  push:
    branches:
      - main
    tags:
      # Release tags only: vMajor.Minor.Patch, matching pdf_minify.__version__.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on a branch or PR; never cancel tag (release) builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  # The app's own Python (embeddable package) and the encoders, all pinned.
  PYTHON_VERSION: "3.13.16"
  PYTHON_EMBED_SHA256: "97dae5274cc54867065e8d5a3226e48c35017ed332a0fdb0e27d5b5821961297"
  ZOPFLI_VERSION: "1.0.3"
  ZOPFLI_SHA256: "e955a7739f71af37ef3349c4fa141c648e8775bceb2195be07e86f8e638814bd"
  JBIG2ENC_SPEC: "jbig2enc=0.32=h477610d_0"
  APP: build\PDFMinify

jobs:
  build-windows:
    # x64 only (designer §303).
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python (build and test tools only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Get version
        id: version
        run: |
          $version = python -c "from pdf_minify import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Python embeddable package
        run: |
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile python-embed.zip
          if ((Get-FileHash python-embed.zip -Algorithm SHA256).Hash -ne $env:PYTHON_EMBED_SHA256) { throw "python-embed.zip: wrong SHA-256" }
          Expand-Archive python-embed.zip "$env:APP\python"
          # Search the app folder (..) and site-packages, then run site.
          Set-Content "$env:APP\python\python313._pth" "python313.zip`n.`nLib\site-packages`n..`nimport site" -Encoding ASCII -NoNewline
          Get-Content "$env:APP\python\python313._pth"

      - name: Install the pinned Python packages
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes --no-compile `
            --platform win_amd64 --python-version 3.13 --implementation cp `
            --target "$env:APP\python\Lib\site-packages" -r packaging\windows\requirements.txt
          if ($LASTEXITCODE) { throw "pip install failed" }
          # What the app never loads: Qt's developer tools, QML, stubs, some plugins.
          python packaging\trim_pyside6.py "$env:APP\python\Lib\site-packages\PySide6"
          if ($LASTEXITCODE) { throw "trim failed" }

      - name: Get the jbig2 encoder (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: ${{ env.JBIG2ENC_SPEC }}
          condarc: |
            channels:
              - conda-forge
          init-shell: none

      - name: Set up the Microsoft C compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build zopfli from source
        run: |
          Invoke-WebRequest "https://github.com/google/zopfli/archive/refs/tags/zopfli-$env:ZOPFLI_VERSION.tar.gz" -OutFile zopfli.tar.gz
          if ((Get-FileHash zopfli.tar.gz -Algorithm SHA256).Hash -ne $env:ZOPFLI_SHA256) { throw "zopfli.tar.gz: wrong SHA-256" }
          tar -xzf zopfli.tar.gz
          New-Item -ItemType Directory -Force build\zopfli | Out-Null
          # Static C runtime: zopfli.exe needs no DLL.
          cl /nologo /O2 /MT /Fo:build\zopfli\ /Fe:build\zopfli\zopfli.exe "zopfli-zopfli-$env:ZOPFLI_VERSION\src\zopfli\*.c"
          if ($LASTEXITCODE) { throw "zopfli build failed" }

      - name: Collect the encoders and their licences
        run: |
          $bin = "$env:APP\bin"
          New-Item -ItemType Directory -Force "$bin\licenses" | Out-Null
          $tools = Join-Path $env:MAMBA_ROOT_PREFIX "envs\tools"
          # jbig2.exe and every library of its environment (Leptonica and the
          # image libraries it reads), plus the Microsoft C++ runtime.
          Copy-Item "$tools\Library\bin\jbig2.exe", "$tools\Library\bin\*.dll" $bin
          Get-ChildItem $tools -Filter *.dll | Where-Object Name -Match '^(vcruntime|msvcp|concrt|vcomp)' | Copy-Item -Destination $bin
          Copy-Item build\zopfli\zopfli.exe $bin
          foreach ($meta in Get-ChildItem "$tools\conda-meta\*.json") {
            $package = Get-Content $meta.FullName -Raw | ConvertFrom-Json
            $unpacked = $package.extracted_package_dir
            if (-not $unpacked) { $unpacked = Join-Path $env:MAMBA_ROOT_PREFIX "pkgs\$($package.name)-$($package.version)-$($package.build)" }
            $licenses = Join-Path $unpacked "info\licenses"
            if (Test-Path $licenses) { Copy-Item $licenses "$bin\licenses\$($package.name)" -Recurse }
            Write-Host "$($package.name) $($package.version) $($package.build)"
          }
          Copy-Item "zopfli-zopfli-$env:ZOPFLI_VERSION\COPYING" "$bin\licenses\zopfli-COPYING.txt"
          foreach ($name in "jbig2enc", "leptonica") {
            if (-not (Test-Path "$bin\licenses\$name")) { throw "no licence found for $name" }
          }
          Get-ChildItem $bin

      - name: Copy the app
        run: |
          Copy-Item pdf_minify "$env:APP\pdf_minify" -Recurse
          Get-ChildItem "$env:APP\pdf_minify" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item packaging\windows\pdf-minify.pyw, packaging\windows\pdf-minify.ico $env:APP
          Copy-Item LICENSE "$env:APP\LICENSE.txt"
          # Portable copy: start without a Python file association.
          Set-Content "$env:APP\PDF Minify.cmd" "@start `"`" `"%~dp0python\pythonw.exe`" `"%~dp0pdf-minify.pyw`" %*" -Encoding ASCII
          # Compiled once here, so the app never writes into its install folder.
          & "$env:APP\python\python.exe" -m compileall -q --invalidation-mode unchecked-hash `
            "$env:APP\pdf_minify" "$env:APP\python\Lib\site-packages"
          if ($LASTEXITCODE) { throw "compileall failed" }

      - name: Smoke test the built app
        run: |
          & "$env:APP\python\python.exe" packaging\smoke_test.py $env:APP
          if ($LASTEXITCODE) { throw "smoke test failed" }

      - name: Run the full test suite against the built app
        run: |
          python -m pip install pytest pytest-timeout
          # The built app's code and packages first; the checkout for tests and tools.
          $env:PYTHONPATH = "$PWD\$env:APP;$PWD\$env:APP\python\Lib\site-packages;$PWD"
          $env:QT_QPA_PLATFORM = "offscreen"
          # Tests that look for jbig2 on PATH find the bundled one, rather than skipping.
          $env:PATH = "$PWD\$env:APP\bin;$env:PATH"
          New-Item -ItemType Directory -Force test-logs | Out-Null
          python -P -c "import pdf_minify, pathlib; p = pathlib.Path(pdf_minify.__file__).resolve(); print(p); assert 'build' in p.parts"
          if ($LASTEXITCODE) { throw "tests would not use the built app" }
          $failed = @()
          foreach ($test in Get-ChildItem tests\test_*.py) {
            $log = "test-logs\$($test.BaseName).log"
            python -P -m pytest $test.FullName -q -p no:cacheprovider -rfE --timeout=900 *> $log
            if ($LASTEXITCODE) {
              $failed += $test.BaseName
              Write-Host "FAIL  $($test.BaseName)"
              Get-Content $log | Select-String -Pattern '^(FAILED|ERROR) ' | Select-Object -First 20
            } else {
              Write-Host "ok    $($test.BaseName): $(Get-Content $log -Tail 1)"
            }
          }
          if ($failed) { throw "Failing test files: $($failed -join ', ')" }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-logs
          path: test-logs/
          retention-days: 14

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\$env:APP" `
            "/O$PWD\dist" packaging\windows\pdf-minify.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
          Get-ChildItem dist

      - name: Test the installer (install, run, uninstall)
        run: |
          $setup = (Get-ChildItem dist\pdf-minify_*_windows-x64-setup.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP "PDF Minify test"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$log`""
          if (-not (Test-Path "$dir\pdf-minify.pyw")) { Get-Content $log -Tail 40; throw "not installed" }
          & "$dir\python\python.exe" packaging\smoke_test.py $dir
          if ($LASTEXITCODE) { throw "the installed app failed its smoke test" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          # The uninstaller finishes in a copy of itself; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\pdf_minify"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\pdf_minify") { Get-ChildItem $dir -Recurse | Select-Object -First 20; throw "uninstall left the app behind" }
          Write-Host "Install, run and uninstall: OK"

      - name: Create the portable ZIP
        run: |
          7z a -tzip "dist\pdf-minify_${{ steps.version.outputs.version }}_windows-x64-portable.zip" ".\$env:APP"
          if ($LASTEXITCODE) { throw "7z failed" }
          Get-ChildItem dist

      - name: Upload the installer and portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: pdf-minify-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30

  release:
    name: Attach packages to the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-minify-*-windows-x64
          merge-multiple: true
          path: packages

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.exe
            packages/*.zip
